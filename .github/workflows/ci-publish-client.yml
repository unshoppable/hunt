# Builds the desktop app of a client@<version> release tag and publishes it as the latest GitHub Release, the feed of the
# in-app updater (releases/latest/download/latest.json). Called by ci-release when a release commit carries a client
# tag; dispatchable to retry one.
#   1. build    – the Apple Silicon DMG plus the updater artifacts (Hunt.app.tar.gz, its .sig and latest.json) on a
#                 draft release with the version's section of apps/client/CHANGELOG.md.
#   2. publish  – publishes the draft once every target built; running installs then offer the update.
# The release is created and published with the token of the release GitHub App (secrets RELEASE_APP_ID,
# RELEASE_APP_PRIVATE_KEY): GITHUB_TOKEN may not create one on a commit range that changed workflow files.
# TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD sign the updater artifacts with the key whose public
# half is in tauri.conf.json. Code signing is enabled by adding APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
# APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID as repository secrets and passing them through `env`.
name: 🖥️ CI | Publish Client
run-name: 'Publish client ${{ inputs.version }}'

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: 'Client version whose client@<version> tag is built'
        required: true
  workflow_call:
    inputs:
      version:
        type: string
        required: true

concurrency:
  group: publish-client-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: macos-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client@${{ inputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri

      - run: npm ci

      - name: Release notes from the changelog
        id: notes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo 'notes<<NOTES'
            awk -v version="$VERSION" '$1 == "##" && $2 == version { found = 1; next } found && $1 == "##" { exit } found' apps/client/CHANGELOG.md
            echo 'NOTES'
          } >> "$GITHUB_OUTPUT"

      - name: Generate the release token
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/client
          tagName: client@${{ inputs.version }}
          releaseName: "Hunt v${{ inputs.version }}"
          releaseBody: |
            ${{ steps.notes.outputs.notes }}

            ---

            Download the DMG for your Mac below, or install from Settings → Updates in a running Hunt. The app is not yet signed; on first launch right-click the app and choose Open, or run `xattr -cr /Applications/Hunt.app`.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --bundles app,dmg --config src-tauri/tauri.release.conf.json

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate the release token
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Publish the draft
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: gh release edit "client@$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
