# Builds the VM release of a session@<version> release tag and publishes it as the asset session.tar.gz of the GitHub
# Release session@<version>, laid out as /srv/hunt/current expects (vm/hunt-ctl, session/, relay/). The infrastructure
# repository builds the image new session VMs boot from out of the newest of these releases: its build VM runs the
# release's `hunt-ctl install-tools`, so that new session VMs find the agent's tools. The release is never marked
# latest; the in-app updater reads the latest release, which stays the client's. Called by ci-release when a release
# commit carries a session tag; dispatchable to retry one. The release is created with the token of the release GitHub
# App (secrets RELEASE_APP_ID, RELEASE_APP_PRIVATE_KEY): GITHUB_TOKEN may not create one on a commit range that changed
# workflow files.
name: 🖼️ CI | Publish Session
run-name: 'Publish session ${{ inputs.version }}'

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: 'Session version whose session@<version> tag is built'
        required: true
  workflow_call:
    inputs:
      version:
        type: string
        required: true

concurrency:
  group: publish-session-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        # An explicit bash runs with -o pipefail, the implicit default without.
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: session@${{ inputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - name: Build the session release
        run: |
          npx nx run session:build
          tar -czf "$RUNNER_TEMP/session.tar.gz" --owner=0 --group=0 --numeric-owner -C dist/apps/session .

      - name: Release notes from the changelog
        env:
          VERSION: ${{ inputs.version }}
        run: |
          awk -v version="$VERSION" '$1 == "##" && $2 == version { found = 1; next } found && $1 == "##" { exit } found' \
            apps/session/CHANGELOG.md > "$RUNNER_TEMP/notes.md"

      - name: Generate the release token
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # A retry replaces the asset of the release an earlier run created.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="session@$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" "$RUNNER_TEMP/session.tar.gz" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$RUNNER_TEMP/session.tar.gz" --repo "$GITHUB_REPOSITORY" --verify-tag --latest=false \
              --title "Session $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi
