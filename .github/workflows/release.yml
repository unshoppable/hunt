# Cuts a release in one manually started run (Actions → Release → Run workflow, from master):
#   1. version  – derives the next version from the Conventional Commits since the last v* tag (or from the `bump`
#                 input), rewrites every version file, commits `chore(release): vX.Y.Z`, tags and pushes.
#   2. build    – builds the Apple Silicon DMG at that tag plus the updater artifacts (Hunt.app.tar.gz, its .sig and
#                 latest.json) and attaches them to a draft GitHub Release.
#   3. publish  – publishes the draft once every target built; running installs then offer the update
#                 (see docs/adr/0003-releases-are-cut-by-a-manually-started-workflow.md).
# A failed build leaves the tag and the draft in place: fix the cause, then "Re-run failed jobs" on the same run.
# TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD sign the updater artifacts with the key whose public
# half is in tauri.conf.json. Code signing is enabled by adding APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
# APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID as repository secrets and passing them through `env`.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump; auto derives it from the Conventional Commits since the last tag"
        type: choice
        default: auto
        options: [auto, patch, minor, major]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Compute version and tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.cut.outputs.version }}
      notes: ${{ steps.cut.outputs.notes }}
    steps:
      - name: Refuse branches other than master
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::Releases are cut from master, not from ${{ github.ref_name }}"
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compute next version and rewrite version files
        id: cut
        run: node scripts/release/release.ts --bump "${{ inputs.bump }}"

      - name: Commit, tag and push
        env:
          VERSION: ${{ steps.cut.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v$VERSION"
          git tag "v$VERSION"
          git push origin "HEAD:${{ github.ref_name }}" "v$VERSION"

  build:
    name: Build ${{ matrix.target }}
    needs: version
    runs-on: macos-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ needs.version.outputs.version }}
          releaseName: "Hunt v${{ needs.version.outputs.version }}"
          releaseBody: |
            ${{ needs.version.outputs.notes }}

            ---

            Download the DMG for your Mac below, or install from Settings → Updates in a running Hunt. The app is not yet signed; on first launch right-click the app and choose Open, or run `xattr -cr /Applications/Hunt.app`.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --bundles app,dmg --config src-tauri/tauri.release.conf.json

  publish:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
