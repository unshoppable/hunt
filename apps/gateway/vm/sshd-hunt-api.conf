# Installed by hunt-ctl as /etc/ssh/sshd_config.d/20-hunt-api.conf on the gateway: users outside google-sudoers reach
# the gateway only through the gateway API (/usr/local/bin/hunt-api <method>), without a terminal or forwarding.
Match Group *,!google-sudoers
    ForceCommand /usr/local/bin/hunt-api
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    PermitTunnel no
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    PermitUserRC no
# Ends the block above, so that what sshd_config sets after its Include applies to everyone.
Match all
