# Swap settings for the zram of zram-generator.conf, installed by `hunt-ctl install-tools` as
# /etc/sysctl.d/90-hunt-zram.conf. A swappiness above 100 makes the kernel reclaim anonymous pages (to zram, which costs
# no disk read) before file pages such as the code of running programs; page-cluster 0 reads one page per fault, since
# zram has no seek cost that read-ahead would save.
vm.swappiness = 180
vm.page-cluster = 0
