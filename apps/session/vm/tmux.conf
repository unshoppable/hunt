# /etc/tmux.conf of a session VM (`hunt-ctl install`): the tmux of the user agent, whose session `app` holds the
# windows of the agent's processes and the shells and scripts Hunt's Terminal tab opens. Like `.hunt/tmux.conf` on the
# Mac (`config_text` in apps/client/src-tauri/src/tmux.rs), every pane logs to ~/logs/<window name>.log, which the log
# stream mirrors to the Mac; a log above 20 MiB moves to <name>.log.1 when its window starts. The hooks give a pane
# without a log pipe one after a new window, pane or session and after any `pipe-pane`, since a `pipe-pane -o` (an older
# Hunt's, or an agent's) closes a pipe that is open and opens none. tmux passes the pipe's command through strftime, so
# it holds no `%` (hence `find -size` instead of `stat`).
set -g history-limit 50000
set -gw automatic-rename off
set -gw allow-rename off
set-hook -g after-new-session { if -F '#{?pane_pipe,,1}' { pipe-pane "mkdir -p /home/agent/logs; log=/home/agent/logs/#{q:window_name}.log; [ -n \"\$(find \"\$log\" -size +20480k 2>/dev/null)\" ] && mv -f \"\$log\" \"\$log.1\"; exec cat >> \"\$log\"" } }
set-hook -g after-new-window { if -F '#{?pane_pipe,,1}' { pipe-pane "mkdir -p /home/agent/logs; log=/home/agent/logs/#{q:window_name}.log; [ -n \"\$(find \"\$log\" -size +20480k 2>/dev/null)\" ] && mv -f \"\$log\" \"\$log.1\"; exec cat >> \"\$log\"" } }
set-hook -g after-split-window { if -F '#{?pane_pipe,,1}' { pipe-pane "mkdir -p /home/agent/logs; log=/home/agent/logs/#{q:window_name}.log; [ -n \"\$(find \"\$log\" -size +20480k 2>/dev/null)\" ] && mv -f \"\$log\" \"\$log.1\"; exec cat >> \"\$log\"" } }
set-hook -g after-pipe-pane { if -F '#{?pane_pipe,,1}' { pipe-pane "mkdir -p /home/agent/logs; log=/home/agent/logs/#{q:window_name}.log; [ -n \"\$(find \"\$log\" -size +20480k 2>/dev/null)\" ] && mv -f \"\$log\" \"\$log.1\"; exec cat >> \"\$log\"" } }
