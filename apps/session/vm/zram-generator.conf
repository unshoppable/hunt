# Compressed swap in RAM for a session VM (systemd-zram-generator, installed by `hunt-ctl install-tools` as
# /etc/systemd/zram-generator.conf): the heap pages the agent's Node processes leave untouched (an idle dev server, a
# build's caches) go compressed to /dev/zram0 instead of the kernel evicting code pages and reading them back from the
# boot disk. The disk caps reads at 215 MB/s, so a swap on it would stall the VM as eviction does. zstd packs a V8 heap
# about 3:1, so a third of the memory as swap costs about a ninth of it when full; hunt-agent.slice leaves room for it.
[zram0]
zram-size = ram / 3
compression-algorithm = zstd
swap-priority = 100
