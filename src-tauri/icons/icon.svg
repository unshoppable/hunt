<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Hunt: a capital H over yin and yang. Left is the human, right the AI. The H has no colour of its own: it is the exact inverse of whatever lies beneath it. Bar ends are clearly rounded even at favicon size (rx 40 on a 104 wide bar); the crossbar ends sit inside the stems. Depth like a macOS app icon: both tile halves fade darker towards the bottom, a light rim sits on the top edge and a dark one on the bottom edge, the H casts a soft shadow and carries a glass gloss (lighter top, darker bottom). -->
  <defs>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
    <clipPath id="black"><path d="M512 100 C603.0 290 603.0 420 512 512 C421.0 604 421.0 734 512 924 H924 V100 Z"/></clipPath>
    <g id="h">
      <rect x="280" y="282" width="104" height="520" rx="40"/>
      <rect x="640" y="222" width="104" height="520" rx="40"/>
      <rect x="332" y="460" width="360" height="104"/>
    </g>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcfcfa"/>
      <stop offset="1" stop-color="#e3e3df"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2e"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.26"/>
    </linearGradient>
    <linearGradient id="rimTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rimBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <mask id="maskTop"><rect x="100" y="100" width="824" height="824" fill="url(#rimTop)"/></mask>
    <mask id="maskBottom"><rect x="100" y="100" width="824" height="824" fill="url(#rimBottom)"/></mask>
    <mask id="maskH"><use href="#h" fill="#ffffff"/></mask>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#light)"/>
    <path d="M512 100 C603.0 290 603.0 420 512 512 C421.0 604 421.0 734 512 924 H924 V100 Z" fill="url(#dark)"/>
    <g filter="url(#shadow)">
      <use href="#h" fill="#0b0b0c"/>
      <g clip-path="url(#black)"><use href="#h" fill="#f4f4f2"/></g>
    </g>
    <rect x="280" y="222" width="464" height="580" fill="url(#gloss)" mask="url(#maskH)"/>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="12" mask="url(#maskTop)"/>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="none" stroke="#000000" stroke-opacity="0.45" stroke-width="12" mask="url(#maskBottom)"/>
  </g>
</svg>
